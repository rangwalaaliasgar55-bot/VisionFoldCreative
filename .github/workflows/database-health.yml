name: Database Health Monitor

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

jobs:
  db-health:
    runs-on: ubuntu-latest
    steps:
      - name: Test database connections
        run: |
          echo "## Database Health Report" >> $GITHUB_STEP_SUMMARY
          
          # Test Portfolio API
          portfolio=$(curl -s -w "\n%{http_code}" https://work-1-adsjgxgbreemmjqb.prod-runtime.all-hands.dev/api/portfolio)
          portfolio_status=$(echo "$portfolio" | tail -1)
          portfolio_time=$(curl -s -o /dev/null -w "%{time_total}" https://work-1-adsjgxgbreemmjqb.prod-runtime.all-hands.dev/api/portfolio)
          
          echo "### Portfolio Database" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $portfolio_status" >> $GITHUB_STEP_SUMMARY
          echo "- Response time: ${portfolio_time}s" >> $GITHUB_STEP_SUMMARY
          
          if [ "$portfolio_status" = "200" ]; then
            echo "✅ Healthy" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Issue detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test Messages database
        run: |
          messages=$(curl -s -w "\n%{http_code}" https://work-1-adsjgxgbreemmjqb.prod-runtime.all-hands.dev/api/messages)
          messages_status=$(echo "$messages" | tail -1)
          messages_time=$(curl -s -o /dev/null -w "%{time_total}" https://work-1-adsjgxgbreemmjqb.prod-runtime.all-hands.dev/api/messages)
          
          echo "### Messages Database" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $messages_status" >> $GITHUB_STEP_SUMMARY
          echo "- Response time: ${messages_time}s" >> $GITHUB_STEP_SUMMARY
          
          if [ "$messages_status" = "200" ]; then
            echo "✅ Healthy" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Issue detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Alert on issues
        if: always()
        run: |
          if [ "$portfolio_status" != "200" ] || [ "$messages_status" != "200" ]; then
            echo "database_issue=true" >> $GITHUB_OUTPUT
          fi

      - name: Create alert
        if: steps.test.outputs.database_issue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: 'rangwalaaliasgar55-bot',
              repo: 'VisionFoldCreative',
              title: '🗄️ Database Health Alert',
              body: 'Database connectivity issues detected. Investigate immediately.',
              labels: ['database', 'automated', 'priority:high']
            })
