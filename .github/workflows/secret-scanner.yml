name: Advanced Secret Scanner

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        continue-on-error: true

      - name: Scan for secrets
        run: |
          echo "## Secret Scan Report" >> $GITHUB_STEP_SUMMARY
          
          # Check for common secret patterns
          secrets_found=0
          
          # API keys
          if grep -r "api[_-]key.*==" . --include="*.ts" --include="*.js" 2>/dev/null | grep -v "example\|test" | grep -v ".git"; then
            echo "⚠️ Potential API key found" >> $GITHUB_STEP_SUMMARY
            secrets_found=$((secrets_found+1))
          fi
          
          # Tokens
          if grep -r "token.*==" . --include="*.ts" --include="*.js" 2>/dev/null | grep -v "example\|test" | grep -v ".git"; then
            echo "⚠️ Potential token found" >> $GITHUB_STEP_SUMMARY
            secrets_found=$((secrets_found+1))
          fi
          
          # Passwords
          if grep -r "password.*==" . --include="*.ts" --include="*.js" 2>/dev/null | grep -v "example\|test" | grep -v ".git"; then
            echo "⚠️ Potential password found" >> $GITHUB_STEP_SUMMARY
            secrets_found=$((secrets_found+1))
          fi
          
          if [ "$secrets_found" -eq 0 ]; then
            echo "✅ No obvious secrets detected" >> $GITHUB_STEP_SUMMARY
          fi
