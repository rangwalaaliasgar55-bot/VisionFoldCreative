name: First PR Reward

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  reward:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Check first PR
        uses: actions/github-script@v7
        with:
          script: |
            const sender = context.payload.pull_request.user.login;
            
            // Get user's PRs
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            
            const userPRs = prs.filter(pr => 
              pr.user.login === sender && pr.merged_at !== null
            );
            
            if (userPRs.length === 1) {
              // First PR!
              await github.rest.reactions.createForIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                content: 'tada'
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `🎉 Congratulations, @${sender}! This is your first merged PR!

Thank you for contributing to VisionFold Creative! 🎬`
              });
              
              console.log('First PR reward sent!');
            }
