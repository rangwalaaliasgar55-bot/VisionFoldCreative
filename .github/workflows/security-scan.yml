name: Security Vulnerability Scanner

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: |
          npm audit --json > audit-results.json 2>&1 || true
          
          # Check for critical vulnerabilities
          critical=$(cat audit-results.json | grep -c '"severity":"critical"' || echo "0")
          high=$(cat audit-results.json | grep -c '"severity":"high"' || echo "0")
          
          echo "Critical vulnerabilities: $critical"
          echo "High vulnerabilities: $high"
          
          if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
            echo "⚠️ Security vulnerabilities found!"
            echo "security_issues=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No critical security issues"
            echo "security_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Create security issue if vulnerabilities found
        if: steps.security.outputs.security_issues == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: 'rangwalaaliasgar55-bot',
              repo: 'VisionFoldCreative',
              title: '🔒 Security Vulnerabilities Detected',
              body: 'Critical or high severity vulnerabilities found. Please update affected packages.',
              labels: ['security', 'automated']
            })

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: audit-results.json
