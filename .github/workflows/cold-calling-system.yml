name: Cold Calling Lead Generator

on:
  schedule:
    - cron: '0 8 * * 1-5'  # Weekdays at 8 AM
  workflow_dispatch:

jobs:
  generate-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze leads from website
        run: |
          echo "## Cold Calling Lead Report" >> $GITHUB_STEP_SUMMARY
          
          # Fetch recent leads
          messages=$(curl -s https://work-1-adsjgxgbreemmjqb.prod-runtime.all-hands.dev/api/messages || echo "[]")
          
          echo "### New Leads for Outreach" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Simulate lead analysis
          echo "1. High Priority Leads:" >> $GITHUB_STEP_SUMMARY
          echo "   - Ready to start projects" >> $GITHUB_STEP_SUMMARY
          echo "   - Budget confirmed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "2. Medium Priority:" >> $GITHUB_STEP_SUMMARY
          echo "   - Researching options" >> $GITHUB_STEP_SUMMARY
          echo "   - Follow up in 1 week" >> $GITHUB_STEP_SUMMARY

      - name: Generate call scripts
        run: |
          echo "### Call Scripts Generated" >> $GITHUB_STEP_SUMMARY
          
          cat << 'EOF' > call-scripts.md
# Cold Call Scripts for VisionFold Creative

## Script 1: Initial Introduction
"Hi [Name], this is [Your Name] from VisionFold Creative. I saw you submitted an inquiry about [project type]. I wanted to follow up and see if you had any questions about our video production services."

## Script 2: Qualification Questions
- "What's your timeline for this project?"
- "What's your budget range?"
- "Who else is involved in the decision?"

## Script 3: Closing
"Would you like to schedule a call to discuss your project in detail?"

---
Generated by OpenHands Automation
EOF
          
          echo "✅ Call scripts saved to call-scripts.md"
          echo "scripts_generated=true" >> $GITHUB_OUTPUT

      - name: Create outreach task
        if: steps.check.outputs.scripts_generated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: 'rangwalaaliasgar55-bot',
              repo: 'VisionFoldCreative',
              title: '📞 Cold Calling Task',
              body: 'Ready for outreach. Check call-scripts.md for scripts and workflow summary for lead priorities.',
              labels: ['sales', 'cold-calling', 'automated']
            })

      - name: Upload scripts
        uses: actions/upload-artifact@v4
        with:
          name: call-scripts
          path: call-scripts.md
