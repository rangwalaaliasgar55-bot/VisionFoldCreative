name: Daily Standup Report

on:
  schedule:
    - cron: '0 9 * * 1-5'  # Weekdays at 9 AM
  workflow_dispatch:

jobs:
  standup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate standup report
        run: |
          echo "## Daily Standup Report - $(date +'%Y-%m-%d')" >> standup.md
          echo "" >> standup.md
          
          echo "### Yesterday" >> standup.md
          git log --since='24 hours ago' --format='- %s' | head -5 >> standup.md || echo "- No commits" >> standup.md
          
          echo "" >> standup.md
          echo "### Today" >> standup.md
          echo "- Review and merge pending PRs" >> standup.md
          echo "- Check issue queue for priorities" >> standup.md
          echo "- Continue development tasks" >> standup.md
          
          echo "" >> standup.md
          echo "### Blockers" >> standup.md
          echo "- None" >> standup.md
          
          echo "" >> standup.md
          echo "### Recent PRs" >> standup.md
          git log --since='7 days ago' --format='- %s (%h)' | grep -i "pull request\|merge\|#[0-9]" | head -5 >> standup.md || echo "- No recent PRs" >> standup.md
          
          cat standup.md

      - name: Create GitHub Discussion
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('standup.md', 'utf8');
            
            await github.rest.discussions.create({
              categoryId: 'DIC_kwD...', // Add your category ID
              title: `Daily Standup - ${new Date().toLocaleDateString()}`,
              body: content
            });
