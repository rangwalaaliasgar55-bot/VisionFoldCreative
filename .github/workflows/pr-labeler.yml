name: Auto PR Labeler

on:
  pull_request:
    types: [opened, synchronize, edited]
  workflow_dispatch:

jobs:
  label-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze PR and add labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title.toLowerCase();
            const labels = [];
            
            // Feature detection
            if (title.includes('feat') || title.includes('feature') || title.includes('add')) {
              labels.push('enhancement');
            }
            // Bug detection
            if (title.includes('fix') || title.includes('bug') || title.includes('hotfix')) {
              labels.push('bug');
            }
            // Docs detection
            if (title.includes('docs') || title.includes('documentation') || title.includes('readme')) {
              labels.push('documentation');
            }
            // Refactor detection
            if (title.includes('refactor') || title.includes('cleanup') || title.includes('clean')) {
              labels.push('refactor');
            }
            // Security detection
            if (title.includes('security') || title.includes('auth') || title.includes('permission')) {
              labels.push('security');
            }
            // Performance detection
            if (title.includes('perf') || title.includes('optimize') || title.includes('speed')) {
              labels.push('performance');
            }
            // Breaking change
            if (title.includes('breaking') || title.includes('breaking-change')) {
              labels.push('breaking-change');
            }
            
            // Add labels
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labels
              });
            }
