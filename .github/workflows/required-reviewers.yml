name: Required Reviewers Enforcement

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Check required reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get required reviewers from CODEOWNERS
            let requiredTeams = ['@rangwalaaliasgar55-bot'];
            
            // Check if PR has all required approvals
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: pr.number
            });
            
            const approvedBy = reviews
              .filter(r => r.state === 'APPROVED')
              .map(r => r.user.login);
            
            console.log('Approved by:', approvedBy);
            console.log('Required team reviewers:', requiredTeams);
            
            // Add comment
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: `## ✅ Review Status\n\nApproved: ${approvedBy.length > 0 ? approvedBy.join(', ') : 'None'}\n\nPlease ensure all required reviewers have approved before merging.`
            });
