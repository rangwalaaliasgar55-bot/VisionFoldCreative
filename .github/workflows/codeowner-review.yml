name: Request Code Owner Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Request reviews from code owners
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let owners = [];
            
            try {
              const content = fs.readFileSync('.github/CODEOWNERS', 'utf8');
              // Parse CODEOWNERS file
              const lines = content.split('\n').filter(l => l && !l.startsWith('#'));
              for (const line of lines) {
                const parts = line.trim().split(/\s+/);
                if (parts.length > 1) {
                  owners.push(...parts.slice(1).map(o => o.replace('@', '')));
                }
              }
            } catch (e) {
              console.log('No CODEOWNERS file found');
              // Default owner
              owners.push('rangwalaaliasgar55-bot');
            }
            
            // Remove duplicates
            owners = [...new Set(owners)];
            
            if (owners.length > 0) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: owners
              });
              console.log(`Requested review from: ${owners.join(', ')}`);
            }
