name: Auto-Heal Service

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

jobs:
  monitor-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Check site status
        id: check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://work-1-adsjgxgbreemmjqb.prod-runtime.all-hands.dev)
          echo "status=$response" >> $GITHUB_OUTPUT
          
          if [ "$response" != "200" ]; then
            echo "ISSUE_DETECTED=true" >> $GITHUB_OUTPUT
            echo "Site returned: $response"
          else
            echo "ISSUE_DETECTED=false" >> $GITHUB_OUTPUT
          fi

      - name: Diagnose if issue found
        if: steps.check.outputs.ISSUE_DETECTED == 'true'
        run: |
          echo "🔍 Diagnosing issue..."
          
          # Check if it's a DNS issue
          nslookup work-1-adsjgxgbreemmjqb.prod-runtime.all-hands.dev || echo "DNS lookup failed"
          
          # Check if it's a timeout
          curl -s -o /dev/null -w "Connect time: %{time_connect}s\n" --max-time 30 https://work-1-adsjgxgbreemmjqb.prod-runtime.all-hands.dev
          
          echo "Diagnostic complete. Manual intervention may be required."

      - name: Create issue if site down
        if: steps.check.outputs.ISSUE_DETECTED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: 'rangwalaaliasgar55-bot',
              repo: 'VisionFoldCreative',
              title: '🚨 Website Health Alert',
              body: `## 🚨 Site Health Alert\n\nThe website returned status: ${{ steps.check.outputs.status }}\n\n**Time:** ${new Date().toISOString()}\n\n**Action Required:** Please investigate and take necessary action.\n\n## Quick Checks:\n- [ ] Check Vercel/VPS dashboard\n- [ ] Check recent deployments\n- [ ] Check error logs\n- [ ] Verify domain/DNS settings`,
              labels: ['bug', 'automated', 'priority:critical']
            })
