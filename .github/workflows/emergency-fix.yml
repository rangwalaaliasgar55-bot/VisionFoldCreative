name: Emergency Fix Process

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number'
        required: true
      severity:
        description: 'Severity'
        type: choice
        default: 'high'
        options:
          - critical
          - high
          - medium
          - low

jobs:
  emergency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create emergency branch
        run: |
          echo "## Emergency Fix Process" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Issue:** #${{ github.event.inputs.issue }}" >> $GITHUB_STEP_SUMMARY
          echo "**Severity:** ${{ github.event.inputs.severity }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Create emergency branch
          branch="emergency/fix-#${{ github.event.inputs.issue }}"
          git checkout -b "$branch"
          
          echo "**Created Branch:** $branch" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Fix the issue" >> $GITHUB_STEP_SUMMARY
          echo "2. Create PR with '[EMERGENCY]' prefix" >> $GITHUB_STEP_SUMMARY
          echo "3. Get expedited review" >> $GITHUB_STEP_SUMMARY
          echo "4. Fast-track merge" >> $GITHUB_STEP_SUMMARY
