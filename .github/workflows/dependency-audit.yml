name: Dependency Audit Report

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 3 AM
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "## Dependency Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          npm audit --json > audit-report.json
          
          # Parse and summarize
          critical=$(cat audit-report.json | jq '.metadata.vulnerabilities.critical // 0')
          high=$(cat audit-report.json | jq '.metadata.vulnerabilities.high // 0')
          medium=$(cat audit-report.json | jq '.metadata.vulnerabilities.medium // 0')
          low=$(cat audit-report.json | jq '.metadata.vulnerabilities.low // 0')
          
          echo "### Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $critical |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $high |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | $medium |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Low | $low |" >> $GITHUB_STEP_SUMMARY
          
          if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
            echo "⚠️ **Action Required:** Update vulnerable packages immediately" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-report.json

      - name: Create issue for vulnerabilities
        if: ${{ env.critical > 0 || env.high > 0 }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 Dependency Audit: Vulnerabilities Found',
              body: 'Critical or high severity vulnerabilities detected. Please update affected packages.',
              labels: ['security', 'automated', 'dependencies']
            });
