name: Code Owner Reminder

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Remind code owners
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Read CODEOWNERS file
            let owners = ['@rangwalaaliasgar55-bot']; // Default owner
            
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.github/CODEOWNERS'
              });
              
              const content = Buffer.from(data.content, 'base64').toString();
              const lines = content.split('\n').filter(l => l && !l.startsWith('#'));
              
              for (const line of lines) {
                const parts = line.trim().split(/\s+/);
                if (parts.length > 1) {
                  owners = parts.slice(1).map(o => o.replace('@', '@'));
                }
              }
            } catch (e) {
              console.log('No CODEOWNERS file found');
            }
            
            // Create reminder comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `👋 **Code Owners Reminder**

Please review this PR:

${owners.map(o => `- ${o}`).join('\n')}

Your review is required before this PR can be merged.`
            });
