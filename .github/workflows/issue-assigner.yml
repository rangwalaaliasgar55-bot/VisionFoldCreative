name: Auto Issue Assigner

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign issues
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            
            // Default assignee
            let assignee = 'rangwalaaliasgar55-bot';
            
            // Auto-assign based on labels
            if (labels.includes('bug')) {
              assignee = 'rangwalaaliasgar55-bot';
            } else if (labels.includes('enhancement')) {
              assignee = 'rangwalaaliasgar55-bot';
            } else if (labels.includes('documentation')) {
              assignee = 'rangwalaaliasgar55-bot';
            }
            
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [assignee]
            });
            
            // Add welcome comment
            const welcomeComment = `
Hello! 👋

Thank you for opening this issue!

**Issue #${issue.number}:** ${issue.title}

I'll review this ${labels.includes('bug') ? 'bug report' : 'request'} and get back to you soon.

---

*🤖 This is an automated response*
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: welcomeComment
            });
