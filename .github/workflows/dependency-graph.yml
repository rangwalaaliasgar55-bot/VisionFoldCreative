name: Dependency Graph Update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dependency graph
        run: |
          echo "## Dependency Graph" >> $GITHUB_STEP_SUMMARY
          
          if [ -f package.json ]; then
            echo "### Direct Dependencies" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat package.json | jq '.dependencies | keys[]' 2>/dev/null || cat package.json | grep -A 50 '"dependencies"' | head -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            
            echo "### Dev Dependencies" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat package.json | jq '.devDependencies | keys[]' 2>/dev/null || cat package.json | grep -A 50 '"devDependencies"' | head -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Total Dependencies" >> $GITHUB_STEP_SUMMARY
          npm ls --depth=0 2>/dev/null | tail -20 >> $GITHUB_STEP_SUMMARY || echo "npm ls not available" >> $GITHUB_STEP_SUMMARY
