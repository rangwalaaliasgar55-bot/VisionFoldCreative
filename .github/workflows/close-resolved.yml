name: Close Resolved Issues

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  close-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Find and close resolved issues
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              per_page: 1
            });
            
            const lastCommit = commits[0];
            const commitMessage = lastCommit.commit.message;
            
            // Look for "Fix #number" or "Closes #number" patterns
            const issueNumbers = commitMessage.match(/(?:fix(?:es)?|close[sd]?|resolve[sd]?)\s+#(\d+)/gi) || [];
            
            for (const match of issueNumbers) {
              const number = match.match(/#(\d+)/i)[1];
              
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number
              });
              
              if (!issue.pull_request && issue.state === 'open') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  state: 'closed'
                });
                console.log(`Closed issue #${number}`);
              }
            }
