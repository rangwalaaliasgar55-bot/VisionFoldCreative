name: PR Title Checker

on:
  pull_request:
    types: [opened, synchronize, edited]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;
            
            const validPrefixes = ['feat', 'fix', 'docs', 'style', 'refactor', 'test', 'chore', 'perf', 'ci', 'build', 'revert'];
            const hasValidFormat = /^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?!?: .+/.test(title);
            
            let comment = '';
            
            if (!hasValidFormat) {
              comment = `## ⚠️ Invalid PR Title Format
              
Your PR title doesn't follow conventional commit format.

**Expected format:** \`type(scope): description\`

**Valid types:** ${validPrefixes.join(', ')}

**Examples:**
- feat(auth): add login form
- fix(api): resolve CORS issue
- docs(readme): update installation guide

**Your title:** "${title}"`;
            } else {
              comment = `## ✅ PR Title Format
              
Your PR title follows conventional commit format!`;
            }
            
            // Check if we already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });
            
            const hasComment = comments.some(c => c.body.includes('PR Title'));
            
            if (!hasComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment
              });
            }
