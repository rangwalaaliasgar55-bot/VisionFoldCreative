name: PR Statistics

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR statistics
        run: |
          echo "## Pull Request Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### This Week" >> $GITHUB_STEP_SUMMARY
          since=$(date -d '7 days ago' +%Y-%m-%d)
          git log --since="$since" --oneline --format="%h %s" | grep -i "pull request" | head -10 >> $GITHUB_STEP_SUMMARY || echo "No PRs this week" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### This Month" >> $GITHUB_STEP_SUMMARY
          since=$(date -d '30 days ago' +%Y-%m-%d)
          git log --since="$since" --oneline --format="%h %s" | grep -i "pull request" | head -10 >> $GITHUB_STEP_SUMMARY || echo "No PRs this month" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Contributors" >> $GITHUB_STEP_SUMMARY
          git log --format="%aN" | sort | uniq -c | sort -rn | head -10 >> $GITHUB_STEP_SUMMARY

      - name: Get GitHub PR data
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            
            console.log(`Total PRs: ${prs.length}`);
            console.log(`Open PRs: ${prs.filter(p => p.state === 'open').length}`);
            console.log(`Merged PRs: ${prs.filter(p => p.merged_at).length}`);
