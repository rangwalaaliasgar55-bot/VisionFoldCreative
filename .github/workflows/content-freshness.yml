name: Content Freshness Alert

on:
  schedule:
    - cron: '0 9 * * 5'  # Fridays at 9 AM
  workflow_dispatch:

jobs:
  content-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check portfolio freshness
        run: |
          echo "## Content Freshness Report" >> $GITHUB_STEP_SUMMARY
          
          # Fetch portfolio
          portfolio=$(curl -s https://work-1-adsjgxgbreemmjqb.prod-runtime.all-hands.dev/api/portfolio || echo "[]")
          count=$(echo "$portfolio" | grep -o '"id"' | wc -l || echo "0")
          
          echo "### Portfolio" >> $GITHUB_STEP_SUMMARY
          echo "- Total projects: $count" >> $GITHUB_STEP_SUMMARY
          
          if [ "$count" -lt 5 ]; then
            echo "⚠️ Consider adding more portfolio items" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate content suggestions
        run: |
          echo "### Content Suggestions" >> $GITHUB_STEP_SUMMARY
          echo "- Add recent project case studies" >> $GITHUB_STEP_SUMMARY
          echo "- Update team member profiles" >> $GITHUB_STEP_SUMMARY
          echo "- Refresh testimonials section" >> $GITHUB_STEP_SUMMARY
          echo "- Update pricing packages" >> $GITHUB_STEP_SUMMARY

      - name: Create content task
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: 'rangwalaaliasgar55-bot',
              repo: 'VisionFoldCreative',
              title: '📝 Weekly Content Refresh',
              body: `## Weekly Content Checklist\n\n- [ ] Add new portfolio items\n- [ ] Update testimonials\n- [ ] Review pricing info\n- [ ] Check team bios\n- [ ] Add blog posts if needed`,
              labels: ['content', 'automated', 'weekly']
            })
