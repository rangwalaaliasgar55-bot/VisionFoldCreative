name: Code Coverage Badge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run tests
        run: |
          npm ci
          npm run test:coverage || npm run test || echo "No tests"

      - name: Generate badge
        run: |
          if [ -f coverage/lcov.info ]; then
            npx coverage-badges --output ./badges 2>/dev/null || echo "Badge generation skipped"
          fi
          
          # Create simple badge
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><rect fill="#4CAF50" width="100" height="20"/><text x="50" y="14" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Coverage</text></svg>' > badge.svg
