name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number'
        required: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run build || echo "Build not configured"

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PR_NUM=${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          
          if [ -n "$VERCEL_TOKEN" ]; then
            npx vercel deploy --token=$VERCEL_TOKEN --preview --yes
          else
            echo "Preview deploy requires VERCEL_TOKEN secret"
          fi

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request?.number || process.env.PR_NUM;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
              body: `## 🎨 Preview Environment

Preview deployment is ready!

**Preview URL:** (configure Vercel deployment)

---
*This is an automated preview environment*
            `;
            });
