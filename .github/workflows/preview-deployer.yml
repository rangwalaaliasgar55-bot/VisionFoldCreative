name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number'
        required: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build preview
        run: npm run build || echo "Build not configured"
        env:
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          NODE_ENV: production

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx vercel deploy --token=$VERCEL_TOKEN --yes || echo "Preview deploy skipped"
          else
            echo "Preview deploy requires VERCEL_TOKEN secret"
          fi
