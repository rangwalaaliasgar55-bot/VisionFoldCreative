name: Newsletter Generator

on:
  schedule:
    - cron: '0 10 1 * *'  # First day of month
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Generate newsletter
        run: |
          echo "## VisionFold Creative Newsletter" >> newsletter.md
          echo "" >> newsletter.md
          echo "# Monthly Newsletter - $(date +'%B %Y')" >> newsletter.md
          echo "" >> newsletter.md
          
          echo "### 🎬 Featured Project" >> newsletter.md
          echo "Check out our latest work..." >> newsletter.md
          echo "" >> newsletter.md
          
          echo "### 📈 Monthly Highlights" >> newsletter.md
          
          # Get recent commits
          echo "**Development Updates:**" >> newsletter.md
          git log --since="$(date -d '1 month ago' +%Y-%m-%d)" --oneline --format="- %s" | head -5 >> newsletter.md
          echo "" >> newsletter.md
          
          echo "### 💡 Industry Tips" >> newsletter.md
          echo "**Quick tip:** Keep your video content fresh by updating thumbnails and titles regularly." >> newsletter.md
          echo "" >> newsletter.md
          
          echo "### 📅 Upcoming Events" >> newsletter.md
          echo "- Client presentations" >> newsletter.md
          echo "- Portfolio showcase" >> newsletter.md
          echo "" >> newsletter.md
          
          echo "### 🤝 Let's Connect" >> newsletter.md
          echo "Follow us on social media for daily updates!" >> newsletter.md
          
          cat newsletter.md

      - name: Create GitHub Discussion
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('newsletter.md', 'utf8');
            
            await github.rest.discussions.create({
              categoryId: 'DIC_kwD...', // Category ID for announcements
              title: `Newsletter - ${new Date().toLocaleString('default', { month: 'long', year: 'numeric' })}`,
              body: content
            });

      - name: Upload newsletter
        uses: actions/upload-artifact@v4
        with:
          name: newsletter
          path: newsletter.md
