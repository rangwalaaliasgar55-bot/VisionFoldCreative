name: Auto Deploy on Merge

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run || echo "No tests configured"

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          NODE_ENV: production

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel --prod --token=$VERCEL_TOKEN --yes || echo "Deploy skipped - configure Vercel secrets"

      - name: Notify deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: 'rangwalaaliasgar55-bot',
              repo: 'VisionFoldCreative',
              title: '🚀 Production Deploy Triggered',
              body: `Auto-deploy from ${context.sha} on main.`
            }).catch(() => {});
