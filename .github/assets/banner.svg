<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="VisionFold Creative — premium video editing studio platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#10162E"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7357FF"/>
      <stop offset="100%" stop-color="#B49CFF"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4A62A"/>
      <stop offset="100%" stop-color="#FFD98A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <!-- ambient moving glow orbs -->
  <circle cx="180" cy="70" r="130" fill="#7357FF" opacity="0.16" filter="url(#glow)">
    <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;110;70" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="200" r="150" fill="#F4A62A" opacity="0.10" filter="url(#glow)">
    <animate attributeName="cx" values="720;640;720" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;150;200" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- film strip -->
  <g opacity="0.9">
    <rect x="340" y="28" width="220" height="34" rx="6" fill="none" stroke="#3A3F5C" stroke-width="1.5"/>
    <g fill="#3A3F5C">
      <rect x="350" y="34" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="0s"   repeatCount="indefinite"/></rect>
      <rect x="372" y="34" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin=".25s" repeatCount="indefinite"/></rect>
      <rect x="394" y="34" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin=".5s"  repeatCount="indefinite"/></rect>
      <rect x="416" y="34" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin=".75s" repeatCount="indefinite"/></rect>
      <rect x="438" y="34" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="1s"   repeatCount="indefinite"/></rect>
      <rect x="460" y="34" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="1.25s" repeatCount="indefinite"/></rect>
      <rect x="482" y="34" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="1.5s" repeatCount="indefinite"/></rect>
      <rect x="504" y="34" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="1.75s" repeatCount="indefinite"/></rect>
      <rect x="526" y="34" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="2s"   repeatCount="indefinite"/></rect>
      <rect x="350" y="48" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin=".1s"  repeatCount="indefinite"/></rect>
      <rect x="372" y="48" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin=".35s" repeatCount="indefinite"/></rect>
      <rect x="394" y="48" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin=".6s"  repeatCount="indefinite"/></rect>
      <rect x="416" y="48" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin=".85s" repeatCount="indefinite"/></rect>
      <rect x="438" y="48" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="1.1s" repeatCount="indefinite"/></rect>
      <rect x="460" y="48" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="1.35s" repeatCount="indefinite"/></rect>
      <rect x="482" y="48" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="1.6s" repeatCount="indefinite"/></rect>
      <rect x="504" y="48" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="1.85s" repeatCount="indefinite"/></rect>
      <rect x="526" y="48" width="14" height="10" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="2.1s" repeatCount="indefinite"/></rect>
    </g>
    <!-- playhead -->
    <rect x="350" y="26" width="2.5" height="38" fill="#F4A62A">
      <animate attributeName="x" values="350;546;350" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- wordmark -->
  <text x="450" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="2">
    <tspan fill="#F6F3EC">VISION</tspan><tspan fill="url(#violet)">FOLD</tspan>
    <animate attributeName="opacity" values="0;1" dur="1.2s"/>
  </text>
  <text x="450" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="6" fill="#B8B3AA">
    C R E A T I V E
    <animate attributeName="opacity" values="0;1" dur="1.6s"/>
  </text>

  <!-- tagline, typed in -->
  <text x="450" y="205" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="url(#amber)">
    We fold stories into motion.
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite" calcMode="discrete" accumulate="none" additive="replace" fill="freeze"/>
  </text>

  <!-- blinking cursor -->
  <rect x="596" y="192" width="9" height="18" fill="#F4A62A">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8A857C">
    <text x="450" y="240" text-anchor="middle">Next.js 16 · React 19 · TypeScript · Tailwind 4 · Three.js · PostgreSQL + Drizzle · Vercel</text>
  </g>

  <!-- hairline frame -->
  <rect x="1" y="1" width="898" height="258" rx="17" fill="none" stroke="#262B45" stroke-width="1.5"/>
</svg>
